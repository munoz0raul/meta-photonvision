# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "photonvision"
BBFILE_PATTERN_photonvision = "^${LAYERDIR}/"
BBFILE_PRIORITY_photonvision = "10"

LAYERDEPENDS_photonvision = "core"
LAYERSERIES_COMPAT_photonvision = "styhead walnascar whinlatter wrynose master"

# This layer ships a prebuilt, closed-to-source JRE tarball and a prebuilt
# PhotonVision fat JAR. Both are fetched at their pinned versions.
LICENSE_PATH += "${LAYERDIR}/licenses"
