name: Build PhotonVision image

on:
  push:
    branches: [imx577-qcs8275]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.board }})
    runs-on: [self-hosted, linux, yocto]
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: iq-8275-evk
            kas_machine: meta-qcom/ci/iq-8275-evk.yml
          - board: iq-9075-evk
            kas_machine: meta-qcom/ci/iq-9075-evk.yml

    steps:
      - name: Checkout meta-photonvision
        uses: actions/checkout@v4
        with:
          path: meta-photonvision

      - name: Run kas build
        run: |
          export PATH="/usr2/raulrm/.local/bin:$PATH"
          export KAS_WORK_DIR=/local/mnt/workspace/build/wrynose-baseline
          export DL_DIR=/local/mnt/workspace/build/downloads
          export SSTATE_DIR=/local/mnt/workspace/build/sstate-cache
          export BB_HASHSERVE_DB_DIR=/local/mnt/workspace/build/sstate-cache
          umask 0022

          rsync -a --delete ${{ github.workspace }}/meta-photonvision/ \
            /local/mnt/workspace/build/wrynose-baseline/meta-photonvision/

          cd /local/mnt/workspace/build/wrynose-baseline
          kas build ${{ matrix.kas_machine }}:meta-qcom/ci/qcom-distro.yml:meta-qcom/ci/performance.yml:meta-qcom/ci/photonvision-local.yml

      - name: Verify shader fix in built .so
        run: |
          SO=$(find /local/mnt/workspace/build/wrynose-baseline/build/tmp/sysroots-components/armv8-2a/photon-libcamera-gl-driver \
            -name "libphotonlibcamera.so" 2>/dev/null | head -1)
          echo "Checking: $SO"
          count=$(strings "$SO" | grep -c 'float(i) - 1.0')
          echo "Shader fix occurrences: $count"
          test "$count" -ge 1

      - name: Stage and split artifact for release
        id: artifact
        run: |
          TARBALL=$(readlink -f /local/mnt/workspace/build/wrynose-baseline/build/tmp/deploy/images/${{ matrix.board }}/qcom-multimedia-proprietary-image-${{ matrix.board }}.rootfs.qcomflash.tar.gz)
          DATE=$(date +%Y-%m-%d)
          SHORT_SHA=${GITHUB_SHA::7}
          OUTDIR="/local/mnt/workspace/actions-runner/_work/release-${{ matrix.board }}-${DATE}-${SHORT_SHA}"
          mkdir -p "$OUTDIR"
          split -b 1900m "$TARBALL" "${OUTDIR}/photonvision-${{ matrix.board }}-${DATE}-${SHORT_SHA}.qcomflash.tar.gz.part"
          ls -lh "$OUTDIR"/
          echo "files=${OUTDIR}/*.part*" >> $GITHUB_OUTPUT
          echo "tag=photonvision-${{ matrix.board }}-${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=PhotonVision ${{ matrix.board }} — ${DATE} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with flash image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          name: ${{ steps.artifact.outputs.name }}
          body: |
            Automated build from commit ${{ github.sha }}.

            **Board:** ${{ matrix.board }}

            ## Flash instructions
            1. Reassemble: `cat *.partaa *.partab > image.qcomflash.tar.gz`
            2. Extract: `tar -xzf image.qcomflash.tar.gz`
            3. Flash SAIL first (spinor), then OS (ufs) with QDL

            ## Verified
            - Kernel: 6.18.37 (wrynose)
            - PhotonVision: 2026.3.4
            - IMX577 CSI camera support
            - Adreno shader fix included
          files: ${{ steps.artifact.outputs.files }}
          fail_on_unmatched_files: true
